version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: internal/api/gen/
        linters:
          - errcheck
          - govet
          - ineffassign
          - revive
          - staticcheck
          - unused

formatters:
  enable:
    - gofumpt
